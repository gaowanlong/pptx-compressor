[package]
name = "pptx-compressor"
version = "1.3.0"
edition = "2021"
description = "A GUI tool to compress PPTX file size by recompressing embedded images, videos and GIFs"
license = "MIT"

[lib]
# `staticlib` 供鸿蒙电脑 HAP 的 C++ N-API 层链接；桌面端仍按普通 rlib 使用。
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "pptx-compressor"
path = "src/main.rs"
# 鸿蒙构建只产出静态库，不编译 egui 可执行入口。
required-features = ["desktop"]

[features]
# 桌面版（Windows/macOS/Linux）默认启用 egui 外壳。
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui", "dep:rfd"]
# 鸿蒙电脑版：只要纯 Rust 核心 + C ABI，不编译任何窗口/对话框依赖。
ohos = ["ffi"]
# C ABI 在桌面端也可编译，便于用本机测试覆盖 N-API 调用契约。
ffi = []

[dependencies]
# GUI（仅桌面 feature）
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"], optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

# PPTX / ZIP
zip = { version = "2", default-features = false, features = ["deflate"] }

# Image processing
# 只启用 PPTX 实际会遇到的 JPEG / PNG 解码器。默认 features 会拉入
# AVIF/rav1e、EXR、TIFF 等整套编码器，让鸿蒙 HAP 的原生库白白膨胀数倍。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# GIF
gif = "0.13"

# Utilities
rayon = "1"
tempfile = "3"
walkdir = "2"
bytesize = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
